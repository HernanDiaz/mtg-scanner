# Código común (módulo shared) en iPhone: lo compila para iOS y ejecuta sus pruebas
# en el simulador. Solo se puede en un Mac; en Windows se comprueban en la JVM
# (./gradlew :shared:testDebugUnitTest).
name: Código común en iOS

on:
  push:
    paths:
      - "shared/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/shared.yml"
  pull_request:
    paths:
      - "shared/**"
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas en la JVM
        run: ./gradlew :shared:testDebugUnitTest
      - name: Compilar para iPhone y pruebas en el simulador
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:iosSimulatorArm64Test
      - name: Resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: shared/build/reports/tests/
